{% if pagina.has_other_pages %}
<nav class="acciones" aria-label="Páginas">
  {% if pagina.has_previous %}<a href="{% querystring pagina=pagina.previous_page_number %}">Anterior</a>{% endif %}
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
  {% if pagina.has_next %}<a href="{% querystring pagina=pagina.next_page_number %}">Siguiente</a>{% endif %}
</nav>
{% endif %}
