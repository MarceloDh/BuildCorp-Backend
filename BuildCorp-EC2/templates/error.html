{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f2549">
  <meta name="robots" content="noindex">
  <title>{{ titulo }} · BuildCorp</title>
  <link rel="icon" type="image/png" href="{% static 'buildcorp/logo-gato-casco.png' %}">
  <link rel="stylesheet" href="{% static 'buildcorp/fuentes.css' %}">
  <link rel="stylesheet" href="{% static 'buildcorp/estilo.css' %}">
  <link rel="stylesheet" href="{% static 'buildcorp/cliente.css' %}">
</head>
<body class="pagina-error">
  <header class="cabecera">
    <div class="contenedor barra">
      <a class="marca" href="{% url 'portada' %}">
        <img src="{% static 'buildcorp/logo-gato-casco.png' %}" width="44" height="44" alt="">
        <span class="marca-nombre">Build<span>Corp</span></span>
      </a>
      <a href="{% url 'login' %}">Mi cuenta</a>
    </div>
  </header>
  <main class="contenedor error-contenido">
    <section class="error-tarjeta" aria-labelledby="titulo-error">
      <div class="error-ilustracion">
        <span class="error-numero" aria-hidden="true">{{ codigo }}</span>
        <img src="{% static 'buildcorp/gato-ayudante.png' %}" width="1218" height="1292" alt="Gato esfinge con casco de obra y caja de herramientas">
      </div>
      <div class="error-texto">
        <p class="rotulo">BuildCorp · {{ codigo }}</p>
        <h1 id="titulo-error">{{ titulo }}</h1>
        <p>{{ mensaje }}</p>
        <div class="acciones">
          <a class="boton" href="{% url 'portada' %}">Volver al menú principal <span aria-hidden="true">→</span></a>
          <a href="{% url 'catalogo_publico' %}">Explorar catálogo</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
