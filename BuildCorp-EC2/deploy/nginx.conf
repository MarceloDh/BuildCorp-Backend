server {
    listen 80;
    server_name REEMPLAZAR_IP_O_DNS;

    location /static/ {
        alias /opt/buildcorp/staticfiles/;
    }

    location / {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
